## Project-wide Gradle settings.
## Machine-specific values (SDK path, JDK home) belong in local.properties or the
## JAVA_HOME environment variable — never commit them here.

# JVM heap for the Gradle daemon. 3g is enough for this single-module project.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
# Local build cache is disabled by default: on some Windows setups the
# ~/.gradle/caches/build-cache-1 directory cannot be written to, which makes
# dexing fail with "Failed to store cache entry". Enable it manually if you
# have a healthy cache directory:  org.gradle.caching=true
org.gradle.caching=false
org.gradle.configuration-cache=false

# AndroidX / Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
